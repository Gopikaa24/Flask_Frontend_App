name: Flask Frontend App 

on:
  push:
    branches: ["main"] 
  pull_request:
    branches: ["main"]
     
jobs:

  build:
    runs-on: ubuntu-latest

    steps:
     
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run syntax check
        run:  python -m py_compile $(find . -name "*.py")

      - name: Install dependencies
        run: python -m pip install --upgrade pip
             pip install -r requirements.txt

      - name: Build Docker image
        run: docker build -t flask-frontend-app .

      - name: Run container test
        run: docker run -d -p 5000:5000 flask-frontend-app

      - name: Stop container test
        if: always()
        run:  docker rm -f flask-frontend-app || true   

  

      
