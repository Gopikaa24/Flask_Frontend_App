{% extends "base.html" %}
{% block content %}
<h2>User List</h2>
<a href="{{ url_for('main.create') }}" class="btn btn-primary mb-3">Add User</a>
<table class="table table-bordered">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Actions</th>
    </tr>
    {% for user in users %}
    <tr>
        <td>{{ user.id }}</td>
        <td>{{ user.name }}</td>
        <td>{{ user.email }}</td>
        <td>
            <a href="{{ url_for('main.update', user_id=user.id) }}" class="btn btn-warning btn-sm">Edit</a>
            <form action="{{ url_for('main.delete', user_id=user.id) }}" method="POST" style="display:inline-block;">
                <button type="submit" class="btn btn-danger btn-sm">Delete</button>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
